name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify
        run: |
          pnpm check
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Configure release commit signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.GLOTTERFLY_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"

          key_path="$RUNNER_TEMP/glotterfly-release-signing"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_path"
          chmod 600 "$key_path"

          git config user.name "Tai Benvenuti"
          git config user.email "taibenvenuti@gmail.com"
          git config gpg.format ssh
          git config user.signingkey "$key_path"
          git config commit.gpgsign true

          # semantic-release creates lightweight tags itself.
          git config tag.gpgsign false

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Tai Benvenuti
          GIT_AUTHOR_EMAIL: taibenvenuti@gmail.com
          GIT_COMMITTER_NAME: Tai Benvenuti
          GIT_COMMITTER_EMAIL: taibenvenuti@gmail.com
        run: pnpm release
