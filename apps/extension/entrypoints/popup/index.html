<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glotterfly</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Glotterfly</h1>
      <p class="tagline">Translate webpages with your ChatGPT plan.</p>

      <label>
        Target language
        <select id="target-language">
          <option value="fi-FI">Finnish</option>
          <option value="en">English</option>
          <option value="it">Italian</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
        </select>
      </label>

      <button id="inspect-page" type="button">Prepare this page</button>
      <button id="connect" type="button" disabled>Continue with ChatGPT</button>
      <p id="status" role="status">Bootstrap build. SIWC feasibility spike is next.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
